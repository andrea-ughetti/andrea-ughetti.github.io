    Work in Progress:
      - bullet: "**Human Capital in the Technological Era: a Theory of Expertise and Delegation.** Rising labor-market inequality is increasingly linked to how production tasks are divided between human and machine capital, yet most existing frameworks treat that division as a fixed technological fact rather than an individual choice. I develop a model in which a worker allocates effort each period between her own expertise and an increasingly capable machine, with comparative advantage between the two encoded by fixed technology weights over a two-dimensional space of task complexity and non-routineness. Delegating tasks to the machine raises current output but slows the accumulation of human capital, since learning occurs only through active human production — creating a tension between short-run productivity and long-run expertise. I show that the optimal delegation choice is governed by comparative rather than absolute advantage, and that a myopic decision-maker who ignores this future cost of delegation systematically over-automates relative to the forward-looking optimum. The framework combines task-based automation models, cognitive-effort production, and learning-by-doing into a single individual-level optimization problem, offering a microfoundation for how technological change reshapes both the returns to human capital and the incentive to keep investing in it."

      - bullet: "**Technology, Productivity, and Redistribution: Uncovering the Micro Drivers of Macro Trends in Technology-Rich Labor Markets (provisional title).** With *[A. Galliera](https://sites.google.com/view/ariannagalliera), [S. Ghisolfi](https://sites.google.com/view/seleneghisolfi/home), and [F. Panebianco](https://sites.google.com/site/fpanebianco/fabrizio-panebianco)*. As artificial intelligence and other frontier technologies diffuse unevenly across workplaces, employers face a growing tension between rewarding the resulting productivity differences and compressing pay to offset the inequality they create. We combine a formal model with a purpose-built lab experiment to study this trade-off: workers with access to different levels of technology choose how much effort to exert depending on how complementary that technology is to their work, while a manager sets the share of team-based versus individual compensation, trading off incentive provision against an aversion to wage inequality. Because the manager typically cannot observe workers' technology access, complementarity, or true productivity directly, her compensation choice depends on what she can infer about these factors, and we show that gaps between what is true and what the manager can infer are themselves a source of inefficient redistribution. The model yields sharp, testable predictions on how technology access and its complementarity with effort shape the manager's chosen compensation scheme, and we design an incentivized lab experiment — pairing a worker-effort task with managerial pay-setting decisions under varying information conditions — to take these predictions directly to data. By developing the theory and the experimental design in tandem, we aim to pin down not just whether access to better technology shifts redistributive choices, but through which channel it operates — realized productivity, task complementarity, or the manager's imperfect information about either."

