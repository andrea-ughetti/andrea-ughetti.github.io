    Work in Progress:
      - bullet: "**Human Capital in the Technological Era: a Theory of Expertise and Delegation.** A theory of individual delegation between human and machine expertise, showing that automation is governed by comparative rather than absolute advantage, and that myopic agents systematically over-delegate by ignoring the future value of forgone human capital."

      - bullet: "**Technology, Productivity, and Redistribution: Uncovering the Micro Drivers of Macro Trends in Technology-Rich Labor Markets (provisional title).** With *A. Galliera, S. Ghisolfi, and F. Panebianco*. A theoretical model and a lab experiment linking worker-level production under unequal technology access to firm-level compensation design, identifying the channels through which new technology compresses or widens wage differences."

